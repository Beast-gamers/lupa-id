<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa ID Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* ── DASHBOARD LAYOUT ─────────────────────────── */
    #page-dash {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .dash-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }
    .dash-topbar-left { display: flex; align-items: center; gap: 1.25rem; }
    .dash-topbar-left h1 { font-size: 1.0625rem; font-weight: 700; letter-spacing: -0.02em; color: var(--fg); margin: 0; }
    .dash-topbar-left .badge {
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 0.25rem 0.625rem;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .theme-toggle {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--white);
      color: var(--fg);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.125rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .theme-toggle:hover { background: var(--border-light); }

    .dash-body {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .dash-content { width: 100%; max-width: 580px; }

    /* ── LOGIN CARD ────────────────────────────────── */
    .dash-login-card {
      background: var(--white);
      border-radius: 18px;
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow);
      animation: fadeUp 0.5s ease-out;
    }
    .dash-login-card h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
    .dash-login-card .subtitle { font-size: 0.875rem; color: var(--fg-muted); margin-bottom: 2rem; }
    .login-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: var(--primary);
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 16px rgba(99,102,241,0.25);
    }
    .login-error {
      font-size: 0.8125rem;
      color: var(--danger);
      font-weight: 600;
      margin-top: 0.5rem;
      display: none;
    }

    /* ── SEARCH SECTION ────────────────────────────── */
    .search-card {
      background: var(--white);
      border-radius: 18px;
      padding: 1.75rem 2rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.25rem;
      animation: fadeUp 0.5s ease-out 0.1s both;
    }
    .search-card h2 { font-size: 1.125rem; font-weight: 700; margin-bottom: 1.25rem; }
    .radio-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .radio-pill {
      position: relative;
      height: 40px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--fg-muted);
      font-size: 0.8125rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .radio-pill:hover { border-color: var(--primary); color: var(--primary); }
    .radio-pill.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }
    .search-row {
      display: flex;
      gap: 0.625rem;
      align-items: stretch;
    }
    .search-row .field { flex: 1; height: 44px; margin-bottom: 0; }
    .search-btn {
      height: 44px;
      padding: 0 1.25rem;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 700;
      font-size: 0.8125rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .search-btn:hover { background: var(--primary-hover); }
    .search-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── RESULT CARD ───────────────────────────────── */
    .result-card {
      background: var(--white);
      border-radius: 18px;
      padding: 2rem;
      box-shadow: var(--shadow);
      animation: fadeUp 0.4s ease-out;
      display: none;
    }
    .result-card.visible { display: block; }
    .result-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .result-avatar {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    .result-avatar.found { background: #ECFDF5; color: var(--success); }
    .result-avatar.not-found { background: var(--danger-bg); color: var(--danger); }
    .result-header-text h3 { font-size: 1rem; font-weight: 700; color: var(--fg); margin: 0; }
    .result-header-text p { font-size: 0.8125rem; color: var(--fg-muted); margin: 0.125rem 0 0; }
    .result-details { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }
    .detail-row {
      display: flex; align-items: center; gap: 0.875rem;
      padding: 0.875rem 1rem;
      background: var(--bg);
      border-radius: 12px;
    }
    .detail-icon {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--primary-light); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
    .detail-info { min-width: 0; }
    .detail-label { font-size: 0.6875rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-dim); }
    .detail-value { font-size: 0.875rem; font-weight: 600; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .result-actions { display: flex; gap: 0.625rem; }
    .btn-delete {
      height: 40px; padding: 0 1.25rem; border-radius: 10px;
      border: 1.5px solid var(--danger-border); background: var(--danger-bg);
      color: var(--danger); font-size: 0.8125rem; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .btn-delete:hover { background: var(--danger); color: white; border-color: var(--danger); }

    /* ── DELETE CONFIRM MODAL ──────────────────────── */
    .dc-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000;
      display: none; align-items: center; justify-content: center; padding: 1rem;
    }
    .dc-overlay.open { display: flex; }
    .dc-box {
      width: 100%; max-width: 380px;
      background: var(--white); border-radius: 18px;
      padding: 2rem; box-shadow: var(--shadow-lg);
      animation: fadeUp 0.3s ease-out;
    }
    .dc-box h3 { font-size: 1.125rem; font-weight: 700; margin-bottom: 0.5rem; }
    .dc-box p { font-size: 0.8125rem; color: var(--fg-muted); margin-bottom: 1.25rem; line-height: 1.6; }
    .dc-box .field { margin-bottom: 1.25rem; }
    .dc-actions { display: flex; gap: 0.625rem; }
    .dc-actions button { flex: 1; height: 40px; border-radius: 10px; font-size: 0.8125rem; font-weight: 600; font-family: inherit; cursor: pointer; border: none; transition: all 0.2s; }
    .dc-cancel { background: var(--bg); color: var(--fg-muted); border: 1.5px solid var(--border) !important; }
    .dc-cancel:hover { background: var(--border-light); }
    .dc-confirm-delete { background: var(--danger); color: white; }
    .dc-confirm-delete:hover { background: #DC2626; }
    .dc-confirm-delete:disabled { opacity: 0.6; cursor: not-allowed; }

    @media (max-width: 600px) {
      .dash-topbar { padding: 1rem; }
      .dash-body { padding: 1.5rem 1rem; }
      .dash-login-card { padding: 2rem 1.25rem; }
      .search-card { padding: 1.25rem; }
      .radio-group { grid-template-columns: repeat(2, 1fr); }
      .search-row { flex-direction: column; }
      .search-btn { width: 100%; justify-content: center; }
      .result-card { padding: 1.5rem 1.25rem; }
      .result-actions { flex-direction: column; }
    }
  </style>
</head>
<body>
<div id="page-dash">

  <!-- TOPBAR -->
  <header class="dash-topbar">
    <div class="dash-topbar-left">
      <a class="home-logo" href="/" style="text-decoration:none;">
        <span class="home-logo-icon"><i class="bi bi-shield-lock-fill"></i></span>
        Lupa ID
      </a>
      <span class="badge">Admin</span>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"><i class="bi bi-moon-stars-fill"></i></button>
  </header>

  <div class="dash-body">
    <div class="dash-content">

      <!-- LOGIN -->
      <div id="loginSection" class="dash-login-card">
        <div class="login-icon"><i class="bi bi-key-fill"></i></div>
        <h2>Admin Dashboard</h2>
        <p class="subtitle">Enter the dashboard password to continue.</p>
        <form id="loginForm" autocomplete="off">
          <div class="field">
            <label class="field-label">Password</label>
            <div class="field-row">
              <i class="bi bi-lock field-icon"></i>
              <input id="dashPassword" type="password" class="field-input" placeholder="Dashboard password" required>
              <button type="button" class="field-eye" data-target="dashPassword"><i class="bi bi-lock-fill"></i></button>
            </div>
          </div>
          <p class="login-error" id="loginError"></p>
          <button type="submit" id="loginBtn" class="btn-primary" style="width:100%;margin-top:0.75rem;">
            <span class="btn-label">Continue</span>
          </button>
        </form>
      </div>

      <!-- DASHBOARD MAIN -->
      <div id="dashMain" class="hidden">

        <!-- SEARCH -->
        <div class="search-card">
          <h2><i class="bi bi-search me-2" style="color:var(--primary)"></i>Find user</h2>
          <div class="radio-group" id="searchRadios">
            <button type="button" class="radio-pill active" data-field="username">Username</button>
            <button type="button" class="radio-pill" data-field="email">Email</button>
            <button type="button" class="radio-pill" data-field="token">Token</button>
            <button type="button" class="radio-pill" data-field="id">ID</button>
          </div>
          <form id="searchForm">
            <div class="search-row">
              <input id="searchInput" class="field-input" type="text" placeholder="Search by username..." required autocomplete="off">
              <button type="submit" id="searchBtn" class="search-btn">
                <i class="bi bi-arrow-right-circle"></i> Search
              </button>
            </div>
          </form>
        </div>

        <!-- RESULT -->
        <div class="result-card" id="resultCard">
          <div class="result-header">
            <div class="result-avatar found" id="resultAvatar"><i class="bi bi-person-fill"></i></div>
            <div class="result-header-text">
              <h3 id="resultTitle">User found</h3>
              <p id="resultSubtitle"></p>
            </div>
          </div>
          <div class="result-details" id="resultDetails"></div>
          <div class="result-actions" id="resultActions">
            <button class="btn-delete" id="deleteBtn"><i class="bi bi-trash3"></i> Delete account</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- DELETE CONFIRM MODAL -->
  <div class="dc-overlay" id="dcOverlay">
    <div class="dc-box">
      <h3>Delete this account?</h3>
      <p>This action is irreversible. All user data will be permanently removed. Type <strong>CONFIRM</strong> to proceed.</p>
      <div class="field">
        <input id="dcInput" class="field-input" type="text" placeholder='Type "CONFIRM"' autocomplete="off">
      </div>
      <div class="dc-actions">
        <button class="dc-cancel" id="dcCancel" type="button">Cancel</button>
        <button class="dc-confirm-delete" id="dcConfirm" type="button">Delete forever</button>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
